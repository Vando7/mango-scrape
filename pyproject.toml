[project]
name = "deep-dive-scraper"
version = "0.1.0"
description = "Scraper service (FastAPI + patchright + trafilatura). MCP shim in shim/ talks to it over HTTP."
requires-python = ">=3.11"
dependencies = [
    "patchright>=1.48",
    "trafilatura>=2.0",
    "youtube-transcript-api>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
addopts = "-v --tb=short"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
