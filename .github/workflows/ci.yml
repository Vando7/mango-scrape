name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (pure Python tests)
        run: |
          pip install pytest pytest-asyncio youtube-transcript-api pydantic fastapi uvicorn patchright trafilatura httpx

      - name: Run unit tests (cache, pagination, compact — no browser/HTTP)
        run: |
          python -m pytest \
            tests/test_transcript_unit.py \
            -v --tb=short

      # Note: integration tests (scrape, screenshot, YouTube scraping) need a running scraper + Chromium.
      # Run locally with: uv run pytest tests/ -v
